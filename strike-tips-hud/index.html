<!DOCTYPE html>
<html lang="en" style="background: #000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>STRIKE TIPS | HUD</title>
    <link rel="dns-prefetch" href="https://gmpho--strike-tips-racing-serve-api.modal.run">
    <link rel="preconnect" href="https://telegram.org">
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <style>
      html, body {
        background: #000 !important;
        color: #fff !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
      .hud-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1rem;
      }
      .hud-loading .spinner {
        width: 3rem;
        height: 3rem;
        border: 4px solid rgba(168,85,247,0.15);
        border-top-color: #a855f7;
        border-radius: 50%;
        animation: hud-spin 0.8s linear infinite;
      }
      @keyframes hud-spin { to { transform: rotate(360deg); } }
      .hud-loading p {
        font-family: system-ui, -apple-system, sans-serif;
        color: rgba(255,255,255,0.5);
        font-size: 0.75rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        animation: hud-pulse 2s ease-in-out infinite;
      }
      @keyframes hud-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="hud-loading"><div class="spinner"></div><p>Initializing Neural Link...</p></div>
    </div>
    <noscript>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;font-family:system-ui,sans-serif;background:#000;color:#fff;">
          <p style="font-size:1.25rem;color:#a855f7;font-weight:700;margin-bottom:0.5rem;">Strike Tips HUD</p>
          <p style="color:rgba(255,255,255,0.6);font-size:0.875rem;">JavaScript is required. Please enable it or use a modern browser.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

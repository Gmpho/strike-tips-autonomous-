<!DOCTYPE html>
<html lang="en" style="background: #000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRIKE TIPS | OFFLINE</title>
    <style>
      html, body {
        background: #000 !important;
        color: #fff !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .offline-container {
        text-align: center;
        padding: 2rem;
        max-width: 480px;
        border: 1px solid rgba(168, 85, 247, 0.15);
        background: rgba(10, 10, 10, 0.8);
        border-radius: 24px;
        backdrop-blur: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(168, 85, 247, 0.05);
      }
      .offline-icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        display: inline-block;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin: 0 0 0.5rem 0;
        background: linear-gradient(135deg, #a855f7 0%, #10b981 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.7rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        margin-bottom: 1.5rem;
      }
      p {
        color: rgba(255, 255, 255, 0.65);
        font-size: 0.875rem;
        line-height: 1.6;
        margin: 0 0 2rem 0;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%);
        border: 1px solid rgba(168, 85, 247, 0.4);
        color: #fff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .btn:hover {
        border-color: rgba(168, 85, 247, 0.8);
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <h1>Neural Link Severed</h1>
      <div class="status-badge">Offline Mode</div>
      <p>
        Strike Tips was unable to establish a connection to the network. 
        Once preloaded, the browser-local WebGPU AI models and cached bankroll stats will remain accessible offline.
      </p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>

services:
  strike-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: strike-tips-base:latest
    container_name: strike-bot-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - ollama

  odds-monitor:
    build:
      context: .
      dockerfile: Dockerfile.odds
    container_name: odds-monitor-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
      - MAX_CONCURRENT_PAGES=2
    volumes:
      - .:/app
      - ./data/browser_profile:/app/data/browser_profile
    ipc: host
    shm_size: 2gb
    init: true
    security_opt:
      - seccomp:seccomp_profile.json
    command: python3 core_agent/core/adaptive_odds_monitor.py
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1.5G
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data:

services:
  strike-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: strike-tips-base:latest
    container_name: strike-bot-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - ollama

  odds-monitor:
    image: strike-tips-base:latest
    container_name: odds-monitor-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
      - MAX_CONCURRENT_PAGES=2
    volumes:
      - .:/app
    command: python3 core_agent/core/adaptive_odds_monitor.py
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: uberchuckie/ollama-intel-gpu:latest
    container_name: ollama
    ports:
      - "11434:11434"
    devices:
      - /dev/dxg:/dev/dxg
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_LOAD_TIMEOUT=600s
      - ZES_ENABLE_SYSMAN=1
      - OLLAMA_INTEL_GPU=1
      - DEVICE=Arc
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREAD=1
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/usr/local/lib
      - VK_ICD_FILENAMES=/usr/lib/wsl/lib/intel_icd.x86_64.json
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2.5G
    volumes:
      - ollama_data:/root/.ollama
      - /usr/lib/wsl:/usr/lib/wsl:ro
    restart: always

volumes:
  ollama_data:

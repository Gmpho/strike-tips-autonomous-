services:
  strike-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: strike-tips-base:latest
    container_name: strike-bot-new
    command: /bin/sh -c "uvicorn core_agent.api_pkg:app --host 0.0.0.0 --port 8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - .:/app
      - chroma_cache:/root/.cache/chroma
      - playwright_cache:/root/.cache/ms-playwright
    ports:
      - "127.0.0.1:8000:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped
    depends_on:
      - ollama
      - redis

  odds-monitor:
    build:
      context: .
      dockerfile: Dockerfile.odds
    container_name: odds-monitor-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
      - MAX_CONCURRENT_PAGES=2
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - .:/app
      - ./data/browser_profile:/app/data/browser_profile
      - chroma_cache:/root/.cache/chroma
      - playwright_cache:/root/.cache/ms-playwright
    ipc: host
    shm_size: 2gb
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - seccomp:seccomp_profile.json
    command: /bin/sh -c "playwright install chromium 2>&1 || true && python3 core_agent/core/adaptive_odds_monitor.py"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1.5G
    restart: unless-stopped
    depends_on:
      - ollama
      - redis

  redis:
    image: redis:alpine
    container_name: strike-tips-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    expose:
      - "11434"
    environment:
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    expose:
      - "5540"
    volumes:
      - redisinsight_data:/data
    restart: always

volumes:
  ollama_data:
  redisinsight_data:
  redis_data:
  chroma_cache:
  playwright_cache:

services:
  strike-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: strike-tips-base:latest
    container_name: strike-bot-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - .:/app
      - chroma_cache:/root/.cache/chroma
    ports:
      - "8000:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    depends_on:
      - ollama

  odds-monitor:
    build:
      context: .
      dockerfile: Dockerfile.odds
    container_name: odds-monitor-new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MAX_CONCURRENT_PAGES=2
    volumes:
      - .:/app
      - ./data/browser_profile:/app/data/browser_profile
    ipc: host
    shm_size: 2gb
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - seccomp:seccomp_profile.json
    command: python3 core_agent/core/adaptive_odds_monitor.py
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1.5G
    restart: unless-stopped
    depends_on:
      - ollama

  telegram-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-agent-new
    environment:
      - PYTHONPATH=/app
    env_file:
      - .env
    restart: always
    volumes:
      - .:/app
    depends_on:
      - ollama

  redis:
    image: redis:alpine
    container_name: strike-tips-redis
    ports:
      - "6379:6379"
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    restart: always

volumes:
  ollama_data:
  redisinsight_data:
  chroma_cache:
